templates:
  farmersdelight:storage_basket:
    loot:
      template: default:loot_table/self
    settings:
      hardness: 1.5
      resistance: 1.5
      push-reaction: block
      is-randomly-ticking: false
      tags:
      - minecraft:mineable/axe
      sounds:
        break: minecraft:block.${basket_sound}.break
        fall: minecraft:block.${basket_sound}.fall
        hit: minecraft:block.${basket_sound}.hit
        place: minecraft:block.${basket_sound}.place
        step: minecraft:block.${basket_sound}.step
    behaviors:
    - type: simple_storage_block
      title: <!i><lang:container.farmersdelight.basket>
      rows: 3
      allow-input: true
      allow-output: true
    - type: farmersdelight:basket
      transfer-cooldown: 8
      redstone-lock: true
      eject: false
    states:
      properties:
        facing:
          type: direction
          default: up
        waterlogged:
          type: boolean
          default: false
        enabled:
          type: boolean
          default: true
      appearances:
        up_dry:
          model:
            path: ${basket_model}
          state: ${basket_outline_state}
        up_wet:
          model:
            path: ${basket_model}
          auto_state: waterlogged_non_tintable_leaves
        down_dry:
          model:
            path: ${basket_model}
            x: 180
          auto_state: non_tintable_leaves
        down_wet:
          model:
            path: ${basket_model}
            x: 180
          auto_state: waterlogged_non_tintable_leaves
        north_dry:
          model:
            path: ${basket_model}
            x: 90
          auto_state: non_tintable_leaves
        north_wet:
          model:
            path: ${basket_model}
            x: 90
          auto_state: waterlogged_non_tintable_leaves
        south_dry:
          model:
            path: ${basket_model}
            x: 270
          auto_state: non_tintable_leaves
        south_wet:
          model:
            path: ${basket_model}
            x: 270
          auto_state: waterlogged_non_tintable_leaves
        east_dry:
          model:
            path: ${basket_model}
            x: 90
            y: 90
          auto_state: non_tintable_leaves
        east_wet:
          model:
            path: ${basket_model}
            x: 90
            y: 90
          auto_state: waterlogged_non_tintable_leaves
        west_dry:
          model:
            path: ${basket_model}
            x: 90
            y: 270
          auto_state: non_tintable_leaves
        west_wet:
          model:
            path: ${basket_model}
            x: 90
            y: 270
          auto_state: waterlogged_non_tintable_leaves
      variants:
        waterlogged=true:
          settings:
            fluid_state: water
        facing=up,waterlogged=false,enabled=false:
          appearance: up_dry
        facing=up,waterlogged=false,enabled=true:
          appearance: up_dry
        facing=up,waterlogged=true,enabled=false:
          appearance: up_wet
        facing=up,waterlogged=true,enabled=true:
          appearance: up_wet
        facing=down,waterlogged=false,enabled=false:
          appearance: down_dry
        facing=down,waterlogged=false,enabled=true:
          appearance: down_dry
        facing=down,waterlogged=true,enabled=false:
          appearance: down_wet
        facing=down,waterlogged=true,enabled=true:
          appearance: down_wet
        facing=north,waterlogged=false,enabled=false:
          appearance: north_dry
        facing=north,waterlogged=false,enabled=true:
          appearance: north_dry
        facing=north,waterlogged=true,enabled=false:
          appearance: north_wet
        facing=north,waterlogged=true,enabled=true:
          appearance: north_wet
        facing=south,waterlogged=false,enabled=false:
          appearance: south_dry
        facing=south,waterlogged=false,enabled=true:
          appearance: south_dry
        facing=south,waterlogged=true,enabled=false:
          appearance: south_wet
        facing=south,waterlogged=true,enabled=true:
          appearance: south_wet
        facing=east,waterlogged=false,enabled=false:
          appearance: east_dry
        facing=east,waterlogged=false,enabled=true:
          appearance: east_dry
        facing=east,waterlogged=true,enabled=false:
          appearance: east_wet
        facing=east,waterlogged=true,enabled=true:
          appearance: east_wet
        facing=west,waterlogged=false,enabled=false:
          appearance: west_dry
        facing=west,waterlogged=false,enabled=true:
          appearance: west_dry
        facing=west,waterlogged=true,enabled=false:
          appearance: west_wet
        facing=west,waterlogged=true,enabled=true:
          appearance: west_wet
