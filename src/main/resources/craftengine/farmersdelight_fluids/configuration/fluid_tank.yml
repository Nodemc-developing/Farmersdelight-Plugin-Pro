  farmersdelight:fluid_tank:
    material: minecraft:paper
    data:
      item_name: <!i><white>玻璃流体储罐
      lore:
      - <!i><gray>容量：16 桶 / 16000 mB
      - <!i><gray>桶或瓶右键转移；空手打开容器
      - <!i><gray>输入输出支持漏斗；拆除保留流体；染料右键染色
      max_stack_size: 1
    model:
      type: minecraft:model
      path: farmersdelight:block/glass_jug_tinted
      tints:
      - type: minecraft:custom_model_data
        index: 0
        default: 16777215
    settings:
      fluidcore:container:
        capacity: 16000
    behavior:
    - type: fluidcore:container
      item-model: farmersdelight:fluid_tank_visual
    - type: block_item
      block:
        settings:
          hardness: 2.0
          resistance: 6.0
          is_suffocating: false
          is_redstone_conductor: false
          sounds:
            break: minecraft:block.glass.break
            place: minecraft:block.glass.place
        behavior:
          type: fluidcore:tank
          capacity: 16000
          transparent: true
          dyeable: true
          item-model: farmersdelight:fluid_tank_visual
          menu:
            layout: jug
            theme: plain
        loot:
          pools:
          - rolls: 1
            entries:
            - type: item
              item: farmersdelight:fluid_tank
              functions:
              - type: set_count
                count: 1
              - type: fluidcore:preserve_tank
        states:
          properties:
            facing:
              type: horizontal_direction
              default: north
            waterlogged:
              type: boolean
              default: false
          appearances:
            north:
              transparent: true
              entity_renderer:
                type: item_display
                item: farmersdelight:fluid_tank_visual/empty
                yaw: 0
                tint_source:
                  type: fluidcore:tank
              state: chorus_plant[down=true,east=false,north=false,south=false,up=false,west=false]
            north_waterlogged:
              transparent: true
              entity_renderer:
                type: item_display
                item: farmersdelight:fluid_tank_visual/empty
                yaw: 0
                tint_source:
                  type: fluidcore:tank
              auto_state: waterlogged_non_tintable_leaves
              model:
                path: farmersdelight:block/fluid_tank_invisible
                y: 0
            east:
              transparent: true
              entity_renderer:
                type: item_display
                item: farmersdelight:fluid_tank_visual/empty
                yaw: 90
                tint_source:
                  type: fluidcore:tank
              state: chorus_plant[down=true,east=false,north=false,south=false,up=false,west=false]
            east_waterlogged:
              transparent: true
              entity_renderer:
                type: item_display
                item: farmersdelight:fluid_tank_visual/empty
                yaw: 90
                tint_source:
                  type: fluidcore:tank
              auto_state: waterlogged_non_tintable_leaves
              model:
                path: farmersdelight:block/fluid_tank_invisible
                y: 90
            south:
              transparent: true
              entity_renderer:
                type: item_display
                item: farmersdelight:fluid_tank_visual/empty
                yaw: 180
                tint_source:
                  type: fluidcore:tank
              state: chorus_plant[down=true,east=false,north=false,south=false,up=false,west=false]
            south_waterlogged:
              transparent: true
              entity_renderer:
                type: item_display
                item: farmersdelight:fluid_tank_visual/empty
                yaw: 180
                tint_source:
                  type: fluidcore:tank
              auto_state: waterlogged_non_tintable_leaves
