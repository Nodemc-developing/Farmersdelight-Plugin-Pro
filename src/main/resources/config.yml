# Farmersdelight-Plugin-Pro | Server settings
# All features are free and open source. / 全部功能免费开源。
# Recipes: CraftEngine content packs / 配方：CraftEngine 内容包
# Menus: gui.yml / 界面：gui.yml
# Kebab-case setting keys; item IDs and tags retain their spelling.
# 选项使用短横线命名；物品 ID 和标签保持原样。

config-version: 4

language: ''

craftengine-resources:
  unified-categories: true
  auto-completion: true

datapacks:
  tags-enabled: true

recipes:
  discovery:
    enabled: false
    notify: true
    locked-display: placeholder
    locked-icon: BARRIER
    unlock-on-obtain: true
  merge-missing-bundled: false

recipe-book:
  tag-cycle-interval-ticks: 80

recipe-editor:
  enabled: true

recipe-navigation:
  jumps: true

knife-items:
  tags:
  - farmersdelight:tools/knives
  items:
  - farmersdelight:flint_knife
  - farmersdelight:iron_knife
  - farmersdelight:golden_knife
  - farmersdelight:diamond_knife
  - farmersdelight:netherite_knife

experience-reward:
  mode: vanilla
  auraskills:
    skill: farming
    multiplier: 1.0
    raw: false

container-returns:
  farmersdelight:milk_bottle: minecraft:glass_bottle

# Heat sources / 热源
heat-sources:
  entries:
  - states:
      lit: 'false'
    vanilla-block: minecraft:campfire
    heat-source: false
  - states:
      lit: 'false'
    vanilla-block: minecraft:soul_campfire
    heat-source: false
  - vanilla-block-tag: minecraft:campfires
  - vanilla-block: minecraft:magma_block
  - vanilla-block: minecraft:lava_cauldron
  - vanilla-block: minecraft:lava
  - vanilla-block: minecraft:fire
  - vanilla-block: minecraft:soul_fire
  - states:
      fire: 'true'
    custom-block: farmersdelight:stove
  - custom-block-tag: farmersdelight:heat_sources
  - conductor: true
    vanilla-block: minecraft:hopper
    heat-source: false
  tags: []
  vanilla-blocks: []
  vanilla-tags: []
  custom-blocks: []
  conductors: []
  conductor-tags: []

# Cooking pot / 厨锅
cooking-pot:
  recipe-book: true
  cooking:
    default-cook-time: 200
    min-cook-time: 20
    max-cook-time: 6000
  effects:
    bubble:
      enabled: true
      type: BUBBLE_POP
      chance: 0.2
      count: 1
      speed: 0.01
      y-offset: 0.02
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
    steam:
      enabled: true
      type: CLOUD
      chance: 0.05
      count: 1
      speed: 0.02
      secondary:
        enabled: false
        type: SMOKE
        count: 1
        speed: 0.02
        y-offset: 0.05
        offset-x: 0.0
        offset-y: 0.025
        offset-z: 0.0
      y-offset: 0.08
      offset-x: 0.0
      offset-y: 0.03
      offset-z: 0.0
    viewer-distance: 32.0
    interval: 1
  particles:
    view-distance-blocks: 32.0
    interval-ticks: 4
  container-inference:
    enabled: true
    excluded-remainders:
    - minecraft:stick
    - minecraft:bone
  tick-budget: 512
  allow-hopper: true
  pack-contents-on-break: true
  progress-display:
    enabled: false
    scale: 0.5
    show-recipe-name: false
    y-offset: 1.2
    visibility-distance: 10.0
    look-dot-threshold: 0.95
    update-interval-ticks: 8
    disable-above-active-pots: 512

# Cutting board / 砧板
cutting-board:
  sounds:
    fallback:
      sound: minecraft:block.wood.break
      volume: 1.0
      pitch: 0.8
    remove-item:
      volume: 0.25
      pitch: 0.5
    retrieve-volume: 0.25
    retrieve-pitch: 0.5
    tool-sounds:
      minecraft:shears:
        sound: minecraft:entity.sheep.shear
        volume: 1.0
        pitch: 1.0
      '#farmersdelight:tools/knives':
        sound: farmersdelight:block.cutting_board.knife_cut
        volume: 0.8
        pitch-min: 0.9
        pitch-max: 1.1
  display:
    translate-x: 0.0
    translate-y: -0.03
    translate-z: 0.0
    stack-xz-offset: 0.05
  default-tools:
  - '#farmersdelight:tools/knives'
  interaction-mode: stacking
  recipe-only-placement: false
  allow-hopper: true
  dispenser-behavior: true
  default-display-offset:
  - 0.0
  - -0.03
  - 0.0
  display-item-spread: 0.1

# Skillet / 煎锅
skillet:
  handheld:
    enabled: true
    jump-flip:
      enabled: true
    progress-display:
      enabled: true
  cooking:
    default-cook-time: 600
    min-cook-time: 60
    cook-time-multiplier: 0.2
    fire-aspect-bonus: 0.05
    cooling-decrement: 2
  heat:
    allow-conductors: true
  sounds:
    sizzle: {}
    add-food: {}
    add-food-cold: {}
  effects:
    smoke:
      enabled: true
      type: SMOKE
      chance: 0.1
      count: 2
      speed: 0.02
      y-offset: 0.2
      offset-x: 0.1
      offset-y: 0.1
      offset-z: 0.1
    sizzle:
      enabled: true
      chance: 0.03
      volume: 0.5
      pitch: 1.0
    viewer-distance: 32.0
  display:
    scale: 0.5
    translate-y: 0.1
    stack-xz-offset: 0.075
    y-offset: 0.1
    position:
    - 0.0
    - 0.1
    - 0.0
    item-spread: 0.15
  particles:
    interval-ticks: 4
    view-distance-blocks: 32.0
  allow-hopper: true
  tick-budget: 512
  fire-aspect-particle:
    xz-spread: 0.6
    velocity-y-base: 0.3
    velocity-y-extra: 0.8
    velocity-xz: 0.3
    origin-x: 0.5
    origin-y: 0.3
    origin-z: 0.5
  handheld-jump-flip:
    enabled: true

# Stove / 炉灶
stove:
  sounds:
    place-food: {}
  cooking:
    default-cook-time: 600
    cooling-decrement: 2
  effects:
    smoke:
      enabled: true
      type: SMOKE
      chance: 0.05
      count: 1
      speed: 0.02
      y-offset: 0.0
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
    crackle:
      enabled: true
      chance: 0.0125
      volume: 1.0
      pitch: 1.0
    fire:
      enabled: true
      chance: 0.125
    viewer-distance: 32.0
  display:
    scale: 0.375
    slot-offsets:
    - 0.3,1.02,0.2
    - 0.0,1.02,0.2
    - -0.3,1.02,0.2
    - 0.3,1.02,-0.2
    - 0.0,1.02,-0.2
    - -0.3,1.02,-0.2
  particles:
    interval-ticks: 4
    view-distance-blocks: 32.0
    item-smoke-chance: 0.05
    item-smoke-count: 1
  tick-budget: 512

skewer:
  handheld:
    enabled: true

container:
  tick-interval-ticks: 4

# Food effects / 食物效果
buff:
  enabled: true
  persistence:
    restore-retry-delay-ticks: 40
  display:
    enabled: true
    channels:
    - bossbar
    actionbar-separator: '   '
    layout-mode: stacked
    rotation-interval-ticks: 80
    actionbar-refresh-ticks: 30
    styles:
      comfort:
        color: BLUE
        overlay: PROGRESS
      nourishment:
        color: GREEN
        overlay: PROGRESS
  comfort:
    heal-interval-ticks: 80
    heal-amount: 1.0
    enabled: true
  nourishment:
    always-eat: true
    enabled: true

# Villagers / 村民
villager:
  enable: true
  # Pause our automation when the separate VillagersDelight plugin is still installed.
  coexistence:
    pause-with-external-plugin: true
  harvest:
    enable: true
    replant: true
    work-hours-only: true
    block-budget: 64
    planting: {}
    disabled-crops: []
    extra-soils:
    - farmersdelight:rich_soil_farmland
    custom-crops: false
    crops:
      farmersdelight:wheat:
        seed: minecraft:wheat_seeds
      farmersdelight:beetroots:
        seed: minecraft:beetroot_seeds
      farmersdelight:carrots:
        seed: minecraft:carrot
      farmersdelight:potatoes:
        seed: minecraft:potato
      farmersdelight:cabbages:
        seed: farmersdelight:cabbage_seeds
      farmersdelight:onions:
        seed: farmersdelight:onion
      farmersdelight:tomatoes:
        seed: farmersdelight:tomato_seeds
        harvest-mode: pick
        plant-block: farmersdelight:budding_tomatoes
      farmersdelight:rice:
        seed: farmersdelight:rice
        harvest-mode: tall
        water: minecraft:water
        soils:
        - '#minecraft:dirt'
        - minecraft:grass_block
    harvest-drops:
      farmersdelight:wheat: [minecraft:wheat, minecraft:wheat_seeds]
      farmersdelight:beetroots: [minecraft:beetroot, minecraft:beetroot_seeds]
      farmersdelight:carrots: [minecraft:carrot]
      farmersdelight:potatoes: [minecraft:potato]
      farmersdelight:cabbages: [farmersdelight:cabbage, farmersdelight:cabbage_seeds]
      farmersdelight:onions: [farmersdelight:onion]
      farmersdelight:tomatoes: [farmersdelight:tomato, farmersdelight:tomato_seeds]
      farmersdelight:rice: [farmersdelight:rice, farmersdelight:rice_panicle]
  pickup:
    enable: true
    scan-interval-ticks: 20
    radius: 2.5
    discover-plantable-seeds: true
    include-harvest-drops: true
    foods:
    - farmersdelight:cabbage
    - farmersdelight:tomato
    - farmersdelight:onion
    - farmersdelight:rice
    - farmersdelight:rice_panicle
    extra-items: []
  breed:
    enable: true
    scan-interval-ticks: 40
    share-food: true
    share-interval-ticks: 100
    minimum-food-to-share: 24
    discover-foods: false
    protect-custom-seeds: true
    minimum-kept-seeds: 32
    food-points:
      farmersdelight:cabbage: 1
      farmersdelight:tomato: 1
      farmersdelight:onion: 1
      farmersdelight:rice: 2
      farmersdelight:rice_panicle: 0
  compost:
    enabled: true
    max-items-per-work: 20
    minimum-kept-per-item: 32
    default-chance: 0.3
    chances: {}
    items:
    - farmersdelight:cabbage
    - farmersdelight:tomato
    - farmersdelight:onion
    - farmersdelight:rice_panicle
  bonemeal:
    enabled: true
    retry-delay-ticks: 40
  # Inventory inspection/editing requires separate administrator permissions.
  backpack:
    enabled: true
    editable: true
    open-on-sneak: true
    maximum-distance-blocks: 6
  idle-interval-ticks: 200
  farmers-buy-crops:
    enable: true
    trades: []
  wandering-trader-sells:
    enable: true
    items: []

rope:
  max-bell-distance: 24

mushroom-colonies:
  placement:
    always-valid-supports:
    - minecraft:mycelium
    - minecraft:podzol
    - minecraft:crimson_nylium
    - minecraft:warped_nylium
    - minecraft:mushroom_stem
    allow-solid-supports-below-max-light: true
    max-light: 12

enchantments:
  compatibility:
    auto-disable-on-conflict: true
  groups:
    knives:
      table:
        enabled: true
        enchantments:
        - minecraft:sharpness
        - minecraft:smite
        - minecraft:bane_of_arthropods
        - minecraft:unbreaking
        - minecraft:fire_aspect
        - minecraft:knockback
        - minecraft:looting
        - minecraft:fortune
        - minecraft:vanishing_curse
        - $backstabbing
        override-offers: true
        default-enchantability: 12
      anvil:
        enabled: true
        extra-enchantments:
        - minecraft:mending
    skillet:
      table:
        enabled: true
        enchantments:
        - minecraft:sharpness
        - minecraft:smite
        - minecraft:bane_of_arthropods
        - minecraft:unbreaking
        - minecraft:fire_aspect
        - minecraft:knockback
        - minecraft:looting
        - minecraft:vanishing_curse
        override-offers: true
        default-enchantability: 14
      anvil:
        enabled: true
        extra-enchantments:
        - minecraft:mending
    durable:
      table:
        enabled: true
        enchantments:
        - minecraft:unbreaking
        - minecraft:vanishing_curse
        override-offers: true
        default-enchantability: 14
      anvil:
        enabled: true
        extra-enchantments:
        - minecraft:mending
  backstabbing:
    enabled: true
    id: farmersdelight:backstabbing
    definition:
      weight: 5
      max-level: 3
    combat:
      players-only: true
      require-knife: true
      multiplier-base: 1.4
      multiplier-per-level: 0.2
  enable: true
  install-datapack: true
  enabled: true

advancements:
  enabled: true
  auto-disable-missing: true
  force-enable: []
  force-disable: []

compatibility:
  kaleidoscope:
    enabled: true
    knives: true
    recipe-auto-fill: true
    item-tags: true
    food-groups: true
    knife-tags:
    - kaleidoscopecookery:kitchen_knife

# Statistics / 统计
stats:
  cache-player-limit: 2048
  enabled: true
  flush-interval-seconds: 30

particle-throttle:
  stove-threshold: 8
  stove-max-rate: 0.1
  cooking-pot-threshold: 4
  cooking-pot-max-rate: 0.05
  ambient-sound-threshold: 4
  ambient-sound-max-rate: 0.001

hopper-interactions:
  enabled: true

# Scheduling and budgets / 调度与预算
performance:
  warnings:
    enabled: true
    cooldown-seconds: 600
    active-block-threshold: 1000
    cooking-pot-total-threshold: 1000
    cooking-pot-density-threshold: 64
    craftengine-free-state-threshold: 32
  budgets:
    reload-visual-refreshes-per-tick: 32
    pet-tempt-tick-budget: 128
    startup-chunk-loads-per-tick: 16
    chunk-effect-packet-budget: 50
    effect-tick-interval-ticks: 4
  connection-particle-packet-budget: 64
  proxy-display:
    view-distance: 64.0
    sync-interval-ticks: 20
    sync-batch-size: 256
  shutdown-wait-millis: 5000

reload:
  cooldown-seconds: 2

debug:
  enabled: false
  categories: []

damage-type:
  install-datapack: true
