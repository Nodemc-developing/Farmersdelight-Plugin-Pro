# Farmersdelight-Plugin-Pro / 农夫乐事配置
# Public option names follow the PapersDelight snake_case structure. Legacy option names migrate on startup.
# 配置采用 PapersDelight 的 snake_case 分组结构；旧版选项启动时自动备份并迁移。
# config-version/config_format identify this plugin's format; do not copy another plugin's version counter.
# config-version/config_format 标识本插件格式，请勿手工套用其他插件的配置版本号。
# No license key or paid-feature switches are required. / 本插件无需授权码，全部功能免费。
#
# Supported common options: lang, heat_sources, station particles/display/cooking, cutting-board
# hopper/dispenser/tool sounds, comfort/nourishment bossbars and enchantment.enable.
# 兼容项包括语言、热源、工作站粒子/显示/烹饪、砧板漏斗/发射器/工具音效、状态效果显示和附魔开关。
# All remaining groups extend this format with this project's features and performance controls.
# 其他分组为本项目扩展功能及性能预算。第三方专有功能保留原配置并在日志提示，不会伪装为已实现。
# Item IDs/tags are unchanged, including any '-' or '_' within their namespace/path.
# 物品 ID/标签原样保留，命名空间或路径中的 '-'、'_' 不会被改写。
# GUI layouts remain in gui.yml; display-overrides.yml contains per-item/per-tag overrides.
# 界面仍由 gui.yml 配置；逐物品/标签显示覆盖表位于 display-overrides.yml。
# Recipes load from CraftEngine content packs; see PAPERSDELIGHT-COMPAT.zh-CN.md for migration.
# 配方从 CraftEngine 内容包加载；迁移说明见 PAPERSDELIGHT-COMPAT.zh-CN.md。

config-version: 3
config_format: Farmersdelight-Plugin-Pro
# Console language: empty follows the system; player text follows the client language. / 控制台语言；空值跟随系统，玩家文本跟随客户端。
lang: ''
# Ordered rules, first match wins; material or ce_block/ce_block_tag, optional states, heat_source and conductor.
# 按顺序首个匹配生效；可用原版材质或 CE 方块/标签，并设置状态、是否发热和是否导热。tray is currently unsupported.
heat_sources:
- states:
    lit: 'false'
  heat_source: false
  material: CAMPFIRE
- states:
    lit: 'false'
  heat_source: false
  material: SOUL_CAMPFIRE
- vanilla_block_tag: minecraft:campfires
- material: MAGMA_BLOCK
- material: LAVA_CAULDRON
- material: LAVA
- material: FIRE
- material: SOUL_FIRE
- states:
    fire: 'true'
  ce_block: farmersdelight:stove
- ce_block_tag: farmersdelight:heat_sources
- conductor: true
  material: HOPPER
  heat_source: false
# Cooking times are ticks. Particle interval_ticks is rounded up to a 4-tick dispatch pass. / 烹饪时长单位 tick；粒子间隔向上对齐 4 tick。
cooking_pot:
  recipe_book: true
  cooking:
    default_cook_time: 200
    min_cook_time: 20
    max_cook_time: 6000
  container_inference:
    enabled: true
    excluded_remainders:
    - minecraft:stick
    - minecraft:bone
  tick_budget: 512
  allow_hopper: true
  pack_contents_on_break: true
  progress_display:
    enabled: false
    show_recipe_name: false
    y_offset: 1.2
    scale: 0.5
    visibility_distance: 10.0
    look_dot_threshold: 0.95
    update_interval_ticks: 8
    disable_above_active_pots: 512
  effects:
    bubble:
      enabled: true
      type: BUBBLE_POP
      chance: 0.2
      count: 1
      y_offset: 0.02
      offset_x: 0.0
      offset_y: 0.0
      offset_z: 0.0
      speed: 0.01
    steam:
      enabled: true
      type: CLOUD
      chance: 0.05
      count: 1
      y_offset: 0.08
      offset_x: 0.0
      offset_y: 0.03
      offset_z: 0.0
      speed: 0.02
      secondary:
        enabled: false
        type: SMOKE
        count: 1
        y_offset: 0.05
        offset_x: 0.0
        offset_y: 0.025
        offset_z: 0.0
        speed: 0.02
  particles:
    view_distance_blocks: 32.0
    interval_ticks: 4
# display translations are offsets added to the board pose; stack_xz_offset is the maximum random X/Z spread.
# 显示位移叠加至砧板姿态；stack_xz_offset 表示随机 X/Z 偏移幅度。逐物品位置在 display-overrides.yml。
cutting_board:
  default_tools: ["#farmersdelight:tools/knives"]
  interaction_mode: stacking
  recipe_only_placement: false
  sounds:
    fallback:
      sound: minecraft:block.wood.break
      volume: 1.0
      pitch: 0.8
    remove_item:
      volume: 0.25
      pitch: 0.5
  hopper_interaction: true
  dispenser_cutting: true
  tool_sounds:
    minecraft:shears:
      sound: minecraft:entity.sheep.shear
      volume: 1.0
      pitch: 1.0
    '#farmersdelight:tools/knives':
      sound: farmersdelight:block.cutting_board.knife_cut
      volume: 0.8
      pitch_min: 0.9
      pitch_max: 1.1
  display:
    translate_x: 0.0
    translate_y: -0.03
    translate_z: 0.0
    stack_xz_offset: 0.05
# Handheld cooking, hopper input, cooling and fine-grained effects are project extensions. / 手持烹饪、漏斗投料、冷却及精细特效为本项目扩展。
skillet:
  handheld:
    enabled: true
    progress_display:
      enabled: true
  allow_hopper: true
  tick_budget: 512
  cooking:
    default_cook_time: 600
    min_cook_time: 60
    cook_time_multiplier: 0.2
    fire_aspect_bonus: 0.05
    cooling_decrement: 2
  heat:
    allow_conductors: true
  effects:
    smoke:
      enabled: true
      type: SMOKE
      chance: 0.1
      count: 2
      y_offset: 0.2
      offset_x: 0.1
      offset_y: 0.1
      offset_z: 0.1
      speed: 0.02
    sizzle:
      enabled: true
      chance: 0.03
      volume: 0.5
      pitch: 1.0
  display:
    scale: 0.5
    translate_y: 0.1
    stack_xz_offset: 0.075
  particles:
    interval_ticks: 4
    view_distance_blocks: 32.0
# display.slot_offsets preserves arbitrary per-slot positions. / slot_offsets 保留逐槽位自由位置；也兼容 slot_1_x/slot_1_z/col_spacing/row_spacing 格式。
stove:
  tick_budget: 512
  cooking:
    default_cook_time: 600
    cooling_decrement: 2
  effects:
    smoke:
      enabled: true
      type: SMOKE
      chance: 0.05
      count: 1
      y_offset: 0.0
      offset_x: 0.0
      offset_y: 0.0
      offset_z: 0.0
      speed: 0.02
    crackle:
      enabled: true
      chance: 0.0125
      volume: 1.0
      pitch: 1.0
    fire:
      enabled: true
      chance: 0.125
  display:
    scale: 0.375
    slot_offsets:
    - 0.3,1.02,0.2
    - 0.0,1.02,0.2
    - -0.3,1.02,0.2
    - 0.3,1.02,-0.2
    - 0.0,1.02,-0.2
    - -0.3,1.02,-0.2
  particles:
    interval_ticks: 4
    view_distance_blocks: 32.0
# Ingredient/tool/catalyst icon rotation in game ticks. Legacy default stays 80; values round up to a 4-tick GUI callback.
# 原料/工具/催化剂图标轮换间隔（游戏 tick）。沿用原默认 80 tick；向上对齐 4 tick 的界面回调。
recipe_book:
  tag_cycle_interval_ticks: 80
# Per-effect enable applies to consumption, commands, restored state and API calls. / 单独开关同时适用于食用、命令、状态恢复与 API。
nourishment_effect:
  enable: true
  bossbar:
    color: GREEN
    style: SOLID
# heal_interval_ticks=0 disables healing while retaining the effect status. / 设为 0 只禁用治疗，保留效果状态。
comfort_effect:
  heal_interval_ticks: 80
  heal_amount: 1.0
  enable: true
  bossbar:
    color: BLUE
    style: SOLID
enchantment:
  install_datapack: true
  compatibility:
    auto_disable_on_conflict: true
  groups:
    knives:
      table:
        enabled: true
        override_offers: true
        default_enchantability: 12
        enchantments:
        - minecraft:sharpness
        - minecraft:smite
        - minecraft:bane_of_arthropods
        - minecraft:unbreaking
        - minecraft:fire_aspect
        - minecraft:knockback
        - minecraft:looting
        - minecraft:fortune
        - minecraft:vanishing_curse
        - $backstabbing
      anvil:
        enabled: true
        extra_enchantments:
        - minecraft:mending
    skillet:
      table:
        enabled: true
        override_offers: true
        default_enchantability: 14
        enchantments:
        - minecraft:sharpness
        - minecraft:smite
        - minecraft:bane_of_arthropods
        - minecraft:unbreaking
        - minecraft:fire_aspect
        - minecraft:knockback
        - minecraft:looting
        - minecraft:vanishing_curse
      anvil:
        enabled: true
        extra_enchantments:
        - minecraft:mending
    durable:
      table:
        enabled: true
        override_offers: true
        default_enchantability: 14
        enchantments:
        - minecraft:unbreaking
        - minecraft:vanishing_curse
      anvil:
        enabled: true
        extra_enchantments:
        - minecraft:mending
  backstabbing:
    enabled: true
    id: farmersdelight:backstabbing
    definition:
      weight: 5
      max_level: 3
    combat:
      players_only: true
      require_knife: true
      multiplier_base: 1.4
      multiplier_per_level: 0.2
  enable: true
# shutdown_wait_millis is the shared persistence/shutdown deadline (minimum 200ms). SQLite mechanic counters are not provided.
# shutdown_wait_millis 是全部落盘步骤共享的关服期限（最小 200ms），本项目未提供 SQLite 机制计数。
stats:
  shutdown_wait_millis: 5000
# Registry packs install once in the primary world; Folia requires a restart for registry changes. / 注册数据包只安装至主世界，Folia 修改注册表后需重启。
datapacks:
  tags_enabled: true
debug:
  enabled: false
  categories: []
damage_type:
  install_datapack: true
reload:
  cooldown_seconds: 2
advancements:
  enabled: true
  auto_disable_missing: true
  force_enable: []
  force_disable: []
craftengine_resources:
  auto_completion: true
# false keeps intentionally deleted bundled recipes deleted. Discovery only controls recipe-book visibility.
# 关闭补齐可保留主动删除的自带配方；配方发现只控制配方书展示，不限制实际制作。
recipes:
  merge_missing_bundled: false
  discovery:
    enabled: false
    locked_display: placeholder
    locked_icon: BARRIER
    unlock_on_obtain: true
    notify: true
# Runtime maintenance/packet budgets. / 运行期维护与发包预算。
performance:
  warnings:
    enabled: true
    cooldown_seconds: 600
    active_block_threshold: 1000
    cooking_pot_total_threshold: 1000
    cooking_pot_density_threshold: 64
    craftengine_free_state_threshold: 32
  budgets:
    reload_visual_refreshes_per_tick: 32
    pet_tempt_tick_budget: 128
    startup_chunk_loads_per_tick: 16
    chunk_effect_packet_budget: 50
    effect_tick_interval_ticks: 4
  proxy_display:
    view_distance: 64.0
    sync_interval_ticks: 20
    sync_batch_size: 256
hopper_interactions:
  enabled: true
# Optional Senro recipe-book autofill, item tags, food groups and kitchen knives. / 可选森罗配方书自动投料、标签、食材组与厨刀兼容。
compatibility:
  kaleidoscope:
    enabled: true
    recipe_auto_fill: true
    item_tags: true
    food_groups: true
    knives: true
    knife_tags:
    - kaleidoscopecookery:kitchen_knife
knife_items:
  tags:
  - farmersdelight:tools/knives
  items:
  - farmersdelight:flint_knife
  - farmersdelight:iron_knife
  - farmersdelight:golden_knife
  - farmersdelight:diamond_knife
  - farmersdelight:netherite_knife
experience_reward:
  mode: vanilla
  auraskills:
    skill: farming
    multiplier: 1.0
    raw: false
container_returns:
  farmersdelight:milk_bottle: minecraft:glass_bottle
mushroom_colonies:
  placement:
    always_valid_supports:
    - minecraft:mycelium
    - minecraft:podzol
    - minecraft:crimson_nylium
    - minecraft:warped_nylium
    - minecraft:mushroom_stem
    allow_solid_supports_below_max_light: true
    max_light: 12
rope:
  bell_ring_max_distance: 24
# Shared buff master switch, persistence and display channels. / 全局状态效果开关、持久化与展示渠道。
buff:
  enabled: true
  persistence:
    restore_retry_delay_ticks: 40
  display:
    enabled: true
    channels:
    - bossbar
    actionbar_separator: '   '
    layout_mode: stacked
    rotation_interval_ticks: 80
    actionbar_refresh_ticks: 30
recipe_editor:
  enabled: true
recipe_navigation:
  jumps: true
